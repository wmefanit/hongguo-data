name: keepalive
# 防 GitHub 60 天「仓库无活动」静默停用定时工作流。
# 自包含实现：仅用内置 GITHUB_TOKEN，无需任何 Secret / 外部依赖。
# 平时零提交；仅当距上次提交 >= 50 天（临近 60 天阈值）时才提交一次标记刷新计时。

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC 检查一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 临近 60 天阈值时提交保活标记
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交: ${DAYS} 天"
          if [ "$DAYS" -ge 50 ]; then
            echo "接近 60 天阈值，提交保活标记以维持定时器"
            date -u +"%F %T UTC" > .keepalive
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add .keepalive
            git commit -m "chore: keepalive marker ($(date -u +%F))"
            git push
          else
            echo "尚远，跳过（不产生垃圾提交）"
          fi
